type: metrics_single_value
version: 1
description: >-
  Terraform-facing schema for Dashify's o11y:SingleValue chart, scoped to what
  the 1240 existing signalfx_single_value_chart resources in
  terraform-monitoring actually set. Fields with no classic equivalent, plus
  deprecated/runtime-derived/JSON-only ones, are intentionally omitted.

# Permanent gaps, confirmed to have no Dashify equivalent:
# - classic `unit_prefix` (1171 active, all "Metric"/none binary): useKmg2
#   only exists on TimeSeriesChart's chartOptions - SingleValueProps has no
#   binary-unit toggle at all.
# - classic per-plot `viz_options.display_name` (1181 active): SingleValue
#   has no per-plot naming in Dashify. A single-value chart shows one value,
#   so there is nothing to individually label the way a list or time-series
#   chart's per-series names do.
# - classic `refresh_interval` (272 active): see
#   common/signalfx_datasource.yml's file-level note.
# - classic `timezone` (56 active): see the same note.

dashify:
  element:
    name: 'o11y:SingleValue'
    args: []

normalizations:
  - kind: fallback
    target: ['chart', 'maximumSignificantDigits']
    source: ['chart', 'maxPrecision']
  - kind: fallback
    target: ['chart', 'maximumFractionDigits']
    source: ['chart', 'numberPrecision']
  - kind: single_value_publish_label_options
    target: ['chart', 'displayUnit']
    source: ['chart', 'publishLabelOptions']

extends:
  - common/widget.yml
  - common/signalfx_datasource.yml
  - common/precision.yml
  - common/timestamp.yml
  - common/secondary_visualization.yml

properties:
  maximum_fraction_digits:
    type: number
    optional: true
    min: 0
    max: 20
    description: The maximum number of digits to display after the decimal point.
    mapping:
      path: ['chart', 'maximumFractionDigits']

  display_unit:
    # classic single-value charts have no per-plot viz_options concept; the
    # legacy importer collapses viz_options[0]'s unit/prefix/suffix into
    # this one chart-level field (SingleValueProps.displayUnit), which is
    # the only display-unit control SingleValue actually has.
    ref: common/display_unit.yml#display_unit
    optional: true
    mapping:
      path: ['chart', 'displayUnit']

  color_scale:
    type: list
    optional: true
    max_items: 5
    # classic: 1235 color_scale blocks across single-value charts, the
    # second-most-used nested block after viz_options. Classic pairs this with
    # `color_by = "Scale"`; Dashify infers the same thing from colorScale
    # being present, so color_by needs no separate field.
    #
    # Each bucket sets one lower bound (gt or gte) plus a palette color.
    # Upper bounds (lt/lte) are not authored by the Dashify editor - it
    # derives them from the next bucket's lower bound - but they are a real,
    # import-preserved part of the document, so they're modeled for
    # round-trip fidelity even though the editor won't write them itself.
    description: >-
      Color bands applied to the displayed value based on which threshold
      range it falls in. Buckets are evaluated in the order given.
    mapping:
      path: ['chart', 'colorScale']
    item:
      properties:
        gt:
          type: float
          optional: true
          conflicts_with: [gte]
          # Real thresholds are not always whole numbers - confirmed against
          # terraform-monitoring (e.g. `gt = 0.5`, `gte = 99.9`).
          description: >-
            This bucket's lower bound, exclusive. Mutually exclusive with
            `gte`.
          mapping:
            path: ['gt']
        gte:
          type: float
          optional: true
          conflicts_with: [gt]
          description: >-
            This bucket's lower bound, inclusive. Mutually exclusive with
            `gt`.
          mapping:
            path: ['gte']
        lt:
          type: float
          optional: true
          conflicts_with: [lte]
          # Import-preserved but not editor-authored - see the file note
          # above.
          description: >-
            This bucket's upper bound, exclusive. Mutually exclusive with
            `lte`. Not settable in the Dashify editor.
          mapping:
            path: ['lt']
        lte:
          type: float
          optional: true
          conflicts_with: [lt]
          description: >-
            This bucket's upper bound, inclusive. Mutually exclusive with
            `lt`. Not settable in the Dashify editor.
          mapping:
            path: ['lte']
        palette_index:
          type: number
          optional: true
          min: 0
          max: 21
          description: The palette color index (0-21) to draw this bucket in.
          mapping:
            path: ['paletteIndex']
