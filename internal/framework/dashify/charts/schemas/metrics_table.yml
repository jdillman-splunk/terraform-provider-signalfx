type: metrics_table
version: 1
description: >-
  A table of metric values with configurable columns and grouping. This is the
  Dashify equivalent of the classic `signalfx_table_chart` resource.

extends:
  - common/widget.yml
  - common/signalfx_datasource.yml
  - common/precision.yml
  - common/timestamp.yml

dashify:
  element:
    name: 'o11y:TableChart'
    args: []

normalizations:
  - kind: fallback
    target: ['chart', 'maximumSignificantDigits']
    source: ['chart', 'maxPrecision']
  - kind: wrap_scalar_array
    target: ['chart', 'groupBy']
  - kind: display_unit
    target: ['chart', 'columns', '*', 'displayUnit']
    unit: ['chart', 'columns', '*', 'unit']
    prefix: ['chart', 'columns', '*', 'prefix']
    suffix: ['chart', 'columns', '*', 'suffix']

properties:
  group_by:
    type: string
    optional: true
    # The underlying Dashify type is string[], but its GroupByOptions select
    # only ever picks one value and wraps it, so this stays a scalar and the
    # serializer wraps.
    description: The metadata property to group table rows by.
    mapping:
      path: ['chart', 'groupBy']
      wrap: array

  hide_missing_values:
    type: bool
    optional: true
    default: false
    description: >-
      Whether to exclude a series whose most recent value is missing, and
      any series whose latest timestamp is older than the newest remaining
      series.
    mapping:
      path: ['chart', 'hideMissingValues']

  disable_sampling:
    type: bool
    optional: true
    default: false
    # Unlike the other chart types, TableChart has a genuine boolean
    # disableSampling prop rather than a numeric sampleSize cap.
    description: >-
      Whether to sample fewer of the matched time series for better
      rendering performance. When disabled, more series are shown but the
      chart may load more slowly.
    mapping:
      path: ['chart', 'disableSampling']

  columns:
    type: list
    optional: true
    # Per-column display comes from here, keyed by SignalFlow publish label,
    # not from the shared published_streams map.
    description: >-
      Per-column display overrides. Each entry corresponds to one SignalFlow
      publish label.
    mapping:
      path: ['chart', 'columns']
    item:
      properties:
        field:
          type: string
          required: true
          description: The SignalFlow publish label this column shows.
          mapping:
            path: ['field']
        header_name:
          type: string
          optional: true
          description: An alternate column header, in place of the raw publish label.
          mapping:
            path: ['headerName']
        display_unit:
          ref: common/display_unit.yml#display_unit
          optional: true
          mapping:
            path: ['displayUnit']
        enabled:
          type: bool
          optional: true
          description: Whether this column is shown.
          mapping:
            path: ['enabled']
