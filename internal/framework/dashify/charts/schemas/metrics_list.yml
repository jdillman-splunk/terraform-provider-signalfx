type: metrics_list
version: 1
description: >-
  A list of metric values, one row per series, with optional sorting and a
  secondary sparkline or gauge per row. This is the Dashify equivalent of the
  classic `signalfx_list_chart` resource. Note that `color_by` and
  `color_scale` render correctly and survive import, but the Dashify UI does
  not write them back when saving, so editing this chart in the UI will drop
  them.

dashify:
  element:
    name: 'o11y:List'
    args: []

normalizations:
  - kind: fallback
    target: ['chart', 'maximumSignificantDigits']
    source: ['chart', 'maxPrecision']
  - kind: display_unit
    target: ['chart', 'publishedStreams', '*', 'displayUnit']
    unit: ['chart', 'publishedStreams', '*', 'unit']
    prefix: ['chart', 'publishedStreams', '*', 'prefix']
    suffix: ['chart', 'publishedStreams', '*', 'suffix']

extends:
  - common/widget.yml
  - common/signalfx_datasource.yml
  - common/precision.yml
  - common/timestamp.yml
  - common/secondary_visualization.yml
  - common/published_streams.yml

properties:
  hide_missing_values:
    type: bool
    optional: true
    default: false
    description: >-
      Whether to exclude a series whose most recent value is missing, and
      any series whose latest timestamp is older than the newest remaining
      series.
    mapping:
      path: ['chart', 'hideMissingValues']

  color_by:
    type: enum
    optional: true
    default: Metric
    values: [Dimension, Metric, Scale]
    # `Scale` pairs with `color_scale` below.
    description: >-
      How to assign series colors when no explicit `palette_index` is set:
      by dimension value, uniformly by metric, or by the value thresholds in
      `color_scale`.
    mapping:
      path: ['chart', 'colorBy']

  color_scale:
    type: list
    optional: true
    max_items: 5
    requires_value:
      field: color_by
      value: Scale
    required_when:
      field: color_by
      value: Scale
    # Same bucket shape as the single-value chart's color_scale - see its
    # comment for why lt/lte are modeled even though the editor doesn't author
    # them.
    description: >-
      Color bands applied to each series' value based on which threshold
      range it falls in. Only meaningful when `color_by` is `Scale`.
    mapping:
      path: ['chart', 'colorScale']
    item:
      properties:
        gt:
          type: float
          optional: true
          conflicts_with: [gte]
          description: This bucket's lower bound, exclusive. Mutually exclusive with `gte`.
          mapping:
            path: ['gt']
        gte:
          type: float
          optional: true
          conflicts_with: [gt]
          description: This bucket's lower bound, inclusive. Mutually exclusive with `gt`.
          mapping:
            path: ['gte']
        lt:
          type: float
          optional: true
          conflicts_with: [lte]
          description: >-
            This bucket's upper bound, exclusive. Mutually exclusive with
            `lte`. Not settable in the Dashify editor.
          mapping:
            path: ['lt']
        lte:
          type: float
          optional: true
          conflicts_with: [lt]
          description: >-
            This bucket's upper bound, inclusive. Mutually exclusive with
            `lt`. Not settable in the Dashify editor.
          mapping:
            path: ['lte']
        palette_index:
          type: number
          optional: true
          min: 0
          max: 21
          description: The palette color index to draw this bucket in.
          mapping:
            path: ['paletteIndex']

  display_fields:
    type: list
    optional: true
    description: >-
      Which metadata properties to show as columns, and whether each is
      shown. Unset means "Auto" (Dashify infers fields from the live
      result) rather than an empty custom list.
    # Unset means "Auto" (Dashify infers fields from the live result) rather
    # than an empty custom list, so the provider must distinguish unset from
    # empty.
    mapping:
      path: ['chart', 'displayFields']
    item:
      properties:
        property:
          type: string
          required: true
          description: The metadata property's key name.
          mapping:
            path: ['property']
        enabled:
          type: bool
          required: true
          description: Whether this property's column is shown.
          mapping:
            path: ['enabled']

  sort:
    type: block
    optional: true
    description: >-
      How to order rows. Unset means "Auto" (sorted by the SignalFlow
      publish label, ascending).
    # Dashify splits sort into by + direction. Unset means "Auto".
    mapping:
      path: ['chart', 'sort']
    properties:
      by:
        type: string
        required: true
        description: >-
          The field to sort by, such as `value` or a metadata property
          name.
        mapping:
          path: ['by']
      direction:
        type: enum
        required: true
        values: [asc, desc]
        description: The sort direction.
        mapping:
          path: ['direction']
