type: metrics_list
version: 1
description: >-
  Terraform-facing schema for Dashify's o11y:List chart, scoped to what the
  1806 existing signalfx_list_chart resources in terraform-monitoring actually
  set. Fields with no classic equivalent, plus deprecated/runtime-derived/
  JSON-only ones, are intentionally omitted.

# Permanent gaps, confirmed to have no Dashify equivalent: classic
# `unit_prefix` (List has no binary-unit toggle - see the single-value schema's
# note), `refresh_interval`, and `timezone` (see
# common/signalfx_datasource.yml's file-level note).
#
# Known editor round-trip gap: `color_by` and `color_scale` below are real,
# render-honored, import-preserved List fields, but the Dashify Widget
# Builder's own save path (VizConfig/List.ts) doesn't include them in what it
# writes back, so editing this chart's *other* settings in the Dashify UI and
# saving will silently drop them. Modeled anyway because the alternative -
# omitting a field 1764 real charts set - is a much larger and more certain
# parity loss than a UI-save edge case.

dashify:
  element:
    name: 'o11y:List'
    args: []

normalizations:
  - kind: fallback
    target: ['chart', 'maximumSignificantDigits']
    source: ['chart', 'maxPrecision']
  - kind: display_unit
    target: ['chart', 'publishedStreams', '*', 'displayUnit']
    unit: ['chart', 'publishedStreams', '*', 'unit']
    prefix: ['chart', 'publishedStreams', '*', 'prefix']
    suffix: ['chart', 'publishedStreams', '*', 'suffix']

extends:
  - common/widget.yml
  - common/signalfx_datasource.yml
  - common/precision.yml
  - common/timestamp.yml
  - common/secondary_visualization.yml
  - common/published_streams.yml

properties:
  hide_missing_values:
    type: bool
    optional: true
    default: false
    # classic: `hide_missing_values` (1709/1709 - always explicitly set)
    description: >-
      Whether to exclude a series whose most recent value is missing, and
      any series whose latest timestamp is older than the newest remaining
      series.
    mapping:
      path: ['chart', 'hideMissingValues']

  color_by:
    type: enum
    optional: true
    default: Metric
    values: [Dimension, Metric, Scale]
    # classic: `color_by` (1764/1806). `Scale` pairs with `color_scale`
    # below; Dashify's own default is Metric, though classic authors set
    # Dimension far more often (1513 of 1764).
    description: >-
      How to assign series colors when no explicit `palette_index` is set:
      by dimension value, uniformly by metric, or by the value thresholds in
      `color_scale`.
    mapping:
      path: ['chart', 'colorBy']

  color_scale:
    type: list
    optional: true
    max_items: 5
    requires_value:
      field: color_by
      value: Scale
    required_when:
      field: color_by
      value: Scale
    # classic: 137 color_scale blocks, always paired with color_by = "Scale".
    # Same bucket shape as the single-value chart's color_scale - see its comment
    # for why lt/lte are modeled even though the editor doesn't author them.
    description: >-
      Color bands applied to each series' value based on which threshold
      range it falls in. Only meaningful when `color_by` is `Scale`.
    mapping:
      path: ['chart', 'colorScale']
    item:
      properties:
        gt:
          type: float
          optional: true
          conflicts_with: [gte]
          # Real thresholds are not always whole numbers - confirmed against
          # terraform-monitoring (e.g. `gt = 0.5`, `gte = 99.9`).
          description: This bucket's lower bound, exclusive. Mutually exclusive with `gte`.
          mapping:
            path: ['gt']
        gte:
          type: float
          optional: true
          conflicts_with: [gt]
          description: This bucket's lower bound, inclusive. Mutually exclusive with `gt`.
          mapping:
            path: ['gte']
        lt:
          type: float
          optional: true
          conflicts_with: [lte]
          description: >-
            This bucket's upper bound, exclusive. Mutually exclusive with
            `lte`. Not settable in the Dashify editor.
          mapping:
            path: ['lt']
        lte:
          type: float
          optional: true
          conflicts_with: [lt]
          description: >-
            This bucket's upper bound, inclusive. Mutually exclusive with
            `lt`. Not settable in the Dashify editor.
          mapping:
            path: ['lte']
        palette_index:
          type: number
          optional: true
          min: 0
          max: 21
          description: The palette color index to draw this bucket in.
          mapping:
            path: ['paletteIndex']

  display_fields:
    type: list
    optional: true
    description: >-
      Which metadata properties to show as columns, and whether each is
      shown. Unset means "Auto" (Dashify infers fields from the live
      result) rather than an empty custom list.
    # classic: `legend_options_fields` blocks - 5636 of them across list
    # charts, field-for-field identical ({property, enabled}). Unset means
    # "Auto" (Dashify infers fields from the live result) rather than an empty
    # custom list, so the provider must distinguish unset from empty.
    mapping:
      path: ['chart', 'displayFields']
    item:
      properties:
        property:
          type: string
          required: true
          description: The metadata property's key name.
          mapping:
            path: ['property']
        enabled:
          type: bool
          required: true
          description: Whether this property's column is shown.
          mapping:
            path: ['enabled']

  sort:
    type: block
    optional: true
    description: >-
      How to order rows. Unset means "Auto" (sorted by the SignalFlow
      publish label, ascending).
    # classic: `sort_by` (1391/1742), encoded as a sign-prefixed string -
    # "-value" (1081), "+value" (113), "+sf_metric", "-name", etc. Dashify
    # splits that into by + direction, so the serializer parses the sign off
    # rather than passing the string through. Unset means "Auto".
    mapping:
      path: ['chart', 'sort']
    properties:
      by:
        type: string
        required: true
        description: >-
          The field to sort by, such as `value` or a metadata property
          name.
        mapping:
          path: ['by']
      direction:
        type: enum
        required: true
        values: [asc, desc]
        description: The sort direction.
        mapping:
          path: ['direction']
