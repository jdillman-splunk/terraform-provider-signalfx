type: text
version: 1
description: >-
  Terraform-facing schema for Dashify's o11y:Text chart - a markdown/notes
  widget with no metric plumbing. Scoped to the 1241 existing
  signalfx_text_chart resources in terraform-monitoring, the largest single
  chart-type gap before this schema existed: text charts are the third most
  common classic chart type after time and list charts, mostly used for
  runbook/notes widgets.

# The Olly contract permits an optional datasource and shared widget.links,
# but neither is part of the deliberately curated Terraform text-chart
# surface. `variables` is overwritten by the template from the dashboard's
# own filters at render time, so it is runtime-derived and deliberately not
# modeled here - authoring it would be a no-op.
dashify:
  element:
    name: 'o11y:Text'
    args: []

extends:
  - common/widget.yml

properties:
  markdown:
    type: string
    optional: true
    # classic: `options.markdown` (1229/1241 - near-universal).
    description: >-
      The widget's body content, in GitHub-flavored Markdown or HTML.
    mapping:
      path: ['chart', 'markdown']
